<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Otterful — MML preview (Firebase Furs + Hats)</title>
</head>
<body>
<p id="mml-open-hint" style="font-family:system-ui,sans-serif;margin:0;padding:0.85rem 1.1rem;background:#151922;color:#dce0ea;font-size:14px;line-height:1.45;border-bottom:1px solid #2a3142">
  Open this file in the <a id="mml-viewer-link" href="#" style="color:#8ec5ff;font-weight:600">MML viewer</a> (browsers do not render <code>&lt;m-character&gt;</code> alone).
</p>
<script>
(function () {
  try {
    var u = 'https://viewer.mml.io/main/v1/?url=' + encodeURIComponent(location.href.split('#')[0]);
    var a = document.getElementById('mml-viewer-link');
    if (a) a.href = u;
  } catch (e) {}
})();
</script>
<!-- Same shape as /api/mml output: one body on m-character, wearables as socketed m-models. Bone names match Otterful glTF (mixamorigHead). -->
<m-character
    src="https://firebasestorage.googleapis.com/v0/b/otterful-otters.firebasestorage.app/o/Furs%2FGalaxy.glb?alt=media&amp;token=ca724672-f179-4c2c-8fce-ff78bf28125e"
    anim="https://public.mml.io/character-idle-animation.glb"
    y="-0.72"
>
  <m-model socket="mixamorigHead" src="https://firebasestorage.googleapis.com/v0/b/otterful-otters.firebasestorage.app/o/Hats%2FBackwards-Hat-Red-v2.glb?alt=media&amp;token=9cb17e8f-5d5e-49c7-ab26-a41a8262d697"></m-model>
</m-character>
</body>
</html>
