<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Otterful — Otter MML preview (OGOtter)</title>
    <!--
      Static MML document: open this page URL in viewer.mml.io (not the raw .glb).
      MML/Three.js only play glTF *animation clips* stored in the file’s JSON "animations" array.
      A rig with bones/skins but an empty "animations" list will look static everywhere that reads
      glTF literally (viewer.mml.io, glb-anim-preview, most Three/Babylon viewers). Some hosts
      re-process uploads or use custom runtimes—that can differ from what Firebase serves as raw .glb.
      Sanity-check any URL with glb-anim-preview.html?url=… ; repo fallback: mml/otter-mml-animated-preview.html
    -->
</head>
<body>
    <m-character
        id="otter"
        src="https://firebasestorage.googleapis.com/v0/b/otterful-otters.firebasestorage.app/o/OGOtter.glb?alt=media&token=ecb98adb-0612-4a8e-afec-a91778048a8b"
        y="0"
        ry="20"
        anim-enabled="true"
        anim-loop="true"
    ></m-character>
</body>
</html>
