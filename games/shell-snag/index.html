<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Otter Shell Rush</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }
      .loading-container {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: black;
        color: white;
      }
      .loading-title {
        font-size: 1.5rem;
        font-weight: bold;
        margin-bottom: 1rem;
      }
      .spinner {
        width: 30px;
        height: 30px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: white;
        animation: spin 1s ease-in-out infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      (function () {
        function reportGameSize() {
          const height = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);

          const width = Math.max(document.body.scrollWidth, document.documentElement.scrollWidth);

          window.parent.postMessage(
            {
              type: 'GAME_SIZE_RESPONSE',
              height: height,
              width: width,
            },
            '*',
          );
        }

        window.addEventListener('load', reportGameSize);

        window.addEventListener('resize', reportGameSize);

        window.addEventListener('message', function (event) {
          if (event.data && event.data.type === 'REQUEST_GAME_SIZE') {
            reportGameSize();
          }
        });
      })();
    </script>
    <script>
      (function () {
        try {
          var w =
            localStorage.getItem("otterfulWallet") ||
            localStorage.getItem("otterShellRushWallet");
          if (w && /^0x[a-fA-F0-9]{40}$/i.test(w)) {
            w = w.trim().toLowerCase();
            window.__otterfulConnectedWallet = w;
            if (!window.ethereum && window.top && window.top !== window && window.top.ethereum) {
              window.ethereum = window.top.ethereum;
            }
            var eth = window.ethereum;
            if (eth && eth.request && !eth.__otterfulShimmed) {
              var orig = eth.request.bind(eth);
              eth.request = function (args) {
                var m = args && typeof args === "object" ? args.method : args;
                if (m === "eth_requestAccounts" || m === "eth_accounts") {
                  return Promise.resolve([w]);
                }
                return orig(args);
              };
              eth.__otterfulShimmed = true;
            }
          } else if (!window.ethereum && window.top && window.top !== window && window.top.ethereum) {
            window.ethereum = window.top.ethereum;
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/games/otterful-game-bridge.mjs"></script>
    <script type="module" crossorigin src="./assets/index-CRhgpGKD.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-jkjMc3V_.css">
  </head>
  <body>
    <div id="root">
      <div class="loading-container">
        <h2 class="loading-title">Loading</h2>
        <div class="spinner"></div>
      </div>
    </div>
    <script src="./assets/gamepad-bridge.js" defer></script>
  </body>
</html>
